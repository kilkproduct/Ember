[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ember-foundry"
version = "0.7.0"
description = "On-device Llama-style language foundry with NumPy training and llama.cpp inference"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyarrow==23.0.1",  # Host fixture writer only; never packaged on Android.
    "zstandard>=0.22.0",
]

[tool.setuptools.packages.find]
include = ["ember*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
