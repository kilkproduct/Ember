[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ember-foundry"
version = "0.4.0"
description = "Small on-device GPT language foundry (Python training backend + native C++ inference)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "zstandard>=0.22.0",
]

[tool.setuptools.packages.find]
include = ["ember*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
