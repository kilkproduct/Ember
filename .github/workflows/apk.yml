name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
    paths:
      - "web/**"
      - "android/**"
      - ".github/workflows/apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reuse one debug signing key across runs. Without this, every CI
      # build gets a fresh key and Android refuses to install the new APK
      # over the old one — forcing an uninstall that wipes the on-device
      # corpus/brains. A stable key makes updates keep app data.
      - name: Restore stable debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Assemble debug APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
      # On failure, collect the compiler errors into one annotation so they are
      # readable without downloading the full Gradle log.
      - name: Summarize build errors
        if: failure()
        run: |
          {
            grep -E "^e: " /tmp/gradle.log | head -40
            grep -A4 "^\* What went wrong" /tmp/gradle.log | head -12
          } > /tmp/errors.txt || true
          if [ ! -s /tmp/errors.txt ]; then tail -25 /tmp/gradle.log > /tmp/errors.txt; fi
          BODY=$(sed -e 's/%/%25/g' -e 's/\r//g' /tmp/errors.txt | awk '{printf "%s%%0A", $0}')
          echo "::error::$BODY"
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Ember-debug.apk
      # Fail the build if the APK stops being the native app: the engine
      # runtime must ship and the old web interface must not.
      - name: Verify APK contents
        run: |
          unzip -l Ember-debug.apk > /tmp/apk-contents.txt
          problems=""
          for f in assets/www/native-backend.html assets/www/native-backend.js \
                   assets/www/engine.js assets/www/vendor/tf.min.js classes.dex; do
            grep -q " $f$" /tmp/apk-contents.txt || problems="$problems missing:$f"
          done
          for f in assets/www/index.html assets/www/app.js assets/www/styles.css; do
            grep -q " $f$" /tmp/apk-contents.txt && problems="$problems packaged:$f"
          done
          assets=$(grep -c " assets/www/" /tmp/apk-contents.txt || true)
          size=$(du -h Ember-debug.apk | cut -f1)
          echo "::notice::APK $size · $assets engine assets · $([ -z "$problems" ] && echo ok || echo "$problems")"
          if [ -n "$problems" ]; then
            echo "::error::APK contents are wrong:$problems"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Ember-debug
          path: Ember-debug.apk
          if-no-files-found: error
          retention-days: 30
