name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
    paths:
      - "web/**"
      - "android/**"
      - ".github/workflows/apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reuse one debug signing key across runs. Without this, every CI
      # build gets a fresh key and Android refuses to install the new APK
      # over the old one — forcing an uninstall that wipes the on-device
      # corpus/brains. A stable key makes updates keep app data.
      - name: Restore stable debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Ember-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ember-debug
          path: Ember-debug.apk
          if-no-files-found: error
          retention-days: 30
