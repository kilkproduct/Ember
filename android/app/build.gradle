plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "com.chaquo.python"
}

def pythonStageDir = layout.buildDirectory.dir("generated/pythonSrc")

tasks.register("syncPythonBackend", Sync) {
    from rootProject.file("../ember")
    into pythonStageDir.map { it.dir("ember") }
    exclude "**/__pycache__/**", "**/*.pyc", "**/*.pyo"
}

android {
    namespace "com.kilkproduct.ember"
    compileSdk 34
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.kilkproduct.ember"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "0.5.0"

        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }

        externalNativeBuild {
            cmake {
                // Builds native/llama: Ember's llama.cpp inference engine plus the
                // JNI bridge, statically linking llama.cpp + ggml into one
                // libember_llama.so per ABI. Options mirror llama.cpp's own
                // docs/android.md cross-compilation guidance.
                arguments "-DEMBER_BUILD_LLAMA_TESTS=OFF",
                          "-DGGML_NATIVE=OFF",
                          "-DGGML_OPENMP=OFF",
                          "-DGGML_LLAMAFILE=OFF",
                          "-DLLAMA_OPENSSL=OFF",
                          "-DBUILD_SHARED_LIBS=OFF"
                cppFlags "-std=c++17"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("../../native/llama/CMakeLists.txt")
            version "3.22.1"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            // Release signing is configured by the distributor; never sign a
            // production release with the development/debug key.
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    packaging {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

chaquopy {
    defaultConfig {
        version "3.13"
        pip {
            install "numpy"
            install "zstandard"
        }
    }
    sourceSets {
        getByName("main") {
            srcDir(pythonStageDir)
        }
    }
}

tasks.matching { it.name.startsWith("merge") && it.name.endsWith("PythonSources") }.configureEach {
    dependsOn("syncPythonBackend")
}
preBuild.dependsOn("syncPythonBackend")

dependencies {
    implementation platform("androidx.compose:compose-bom:2024.09.03")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.animation:animation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-core"

    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.activity:activity-compose:1.9.2"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.6"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"

    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"

    androidTestImplementation platform("androidx.compose:compose-bom:2024.09.03")
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
}
