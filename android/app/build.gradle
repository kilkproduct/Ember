plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace "com.kilkproduct.ember"
    compileSdk 34

    defaultConfig {
        applicationId "com.kilkproduct.ember"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "0.3.0"

        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            // Debug signing keeps the existing side-loadable release build.
            // Do not add keystores or signing secrets to the repository.
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    packaging {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2024.09.03")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.animation:animation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-core"

    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.activity:activity-compose:1.9.2"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.6"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"

    // WebViewAssetLoader serves the packaged engine over a stable https
    // origin (required for IndexedDB and module scripts).
    implementation "androidx.webkit:webkit:1.11.0"

    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"

    testImplementation "junit:junit:4.13.2"

    androidTestImplementation platform("androidx.compose:compose-bom:2024.09.03")
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
}

def webDir = rootProject.file("../web")
tasks.register("copyWeb", Copy) {
    from webDir
    into "src/main/assets/www"
    exclude "**/*.map"
    // The Compose screens replaced the web interface. The APK ships the
    // engine runtime and its modules only — not index.html/app.js/styles.css.
    exclude "index.html", "app.js", "styles.css"
}
preBuild.dependsOn copyWeb
